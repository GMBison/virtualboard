name: Verify VirtualBoard
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:plugin
      - run: node --test --test-name-pattern="MCP handles" test/server.test.mjs
        env:
          VIRTUALBOARD_TEST_MCP: plugins/virtualboard/mcp/index.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
