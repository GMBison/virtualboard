<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ee" />
    <title>VirtualBoard</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/board.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path
              d="M7 20c6 0 8-11 12-11 3 0 2 5-1 8-2 3-2 6 1 6 2 0 4-2 6-5M7 25h4"
            />
          </svg>
        </div>
        <h1>Virtual<span>Board</span></h1>
      </div>
      <div class="header-actions">
        <span id="connection" class="connection" role="status"
          ><i></i> Connecting</span
        >
        <button
          id="settings"
          class="button secondary icon-button"
          type="button"
          aria-haspopup="dialog"
          aria-label="Settings"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 3h4l.6 2.5a7 7 0 0 1 1.7 1l2.5-.8 2 3.5-1.9 1.8a7 7 0 0 1 0 2l1.9 1.8-2 3.5-2.5-.8a7 7 0 0 1-1.7 1L14 21h-4l-.6-2.5a7 7 0 0 1-1.7-1l-2.5.8-2-3.5L5.1 13a7 7 0 0 1 0-2L3.2 9.2l2-3.5 2.5.8a7 7 0 0 1 1.7-1Z"
            />
            <circle cx="12" cy="12" r="2.6" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="workspace-title">
        <h2 id="workspace-title">Shared whiteboard</h2>
        <div class="lesson-controls">
          <button
            id="voice"
            class="button secondary"
            type="button"
            aria-pressed="false"
          >
            Voice off
          </button>
          <button
            id="finish"
            class="button secondary"
            type="button"
            disabled
            hidden
          >
            Finish writing
          </button>
        </div>
      </section>
      <section class="workspace" aria-label="Board tools and drawing surface">
        <div class="tools" aria-label="Drawing tools">
          <div class="tool-group">
            <button
              type="button"
              data-tool="pen"
              aria-pressed="true"
              aria-keyshortcuts="P"
              title="Pen (P)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4" /></svg
              ><span>Pen</span>
            </button>
            <button
              type="button"
              data-tool="type"
              aria-pressed="false"
              aria-keyshortcuts="T"
              title="Type (T)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7V4h16v3M12 4v16m-4 0h8" /></svg
              ><span>Type</span>
            </button>
            <button
              type="button"
              data-tool="erase"
              aria-pressed="false"
              aria-keyshortcuts="E"
              title="Eraser (E)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m3 13 9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8H8l-5-5a1.5 1.5 0 0 1 0-2ZM7 9l9 7m-4 4h9"
                /></svg
              ><span>Eraser</span>
            </button>
          </div>
          <div
            id="colors"
            class="tool-group colors"
            aria-label="Ink colors"
          ></div>
          <div class="tool-group history">
            <button
              id="undo"
              type="button"
              disabled
              title="Undo (Ctrl+Z)"
              aria-label="Undo"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5 3 10l5 5M3 10h11a5 5 0 0 1 0 10h-4" />
              </svg>
            </button>
            <button
              id="redo"
              type="button"
              disabled
              title="Redo (Ctrl+Shift+Z)"
              aria-label="Redo"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m16 5 5 5-5 5m5-5H10a5 5 0 0 0 0 10h4" />
              </svg>
            </button>
          </div>
          <button
            class="clear"
            id="clear"
            type="button"
            title="Clear board"
            aria-label="Clear"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7h14m-9 0V4h4v3m3 0-1 13H8L7 7m3 4v5m4-5v5" /></svg
            ><span>Clear</span>
          </button>
          <button
            id="fullscreen"
            type="button"
            title="Full screen"
            aria-label="Full screen"
            aria-pressed="false"
          >
            <svg id="expand-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" />
            </svg>
            <svg
              id="collapse-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              hidden
            >
              <path d="M4 9h5V4m6 0v5h5m0 6h-5v5m-6 0v-5H4" />
            </svg>
          </button>
        </div>
        <div id="paper-scroll" class="paper-scroll" data-zoom="100">
          <svg
            id="paper"
            viewBox="0 0 1100 720"
            role="img"
            aria-label="Shared drawing surface"
            tabindex="0"
          >
            <defs>
              <pattern
                id="dots"
                width="22"
                height="22"
                patternUnits="userSpaceOnUse"
              >
                <circle cx="11" cy="11" r="1" fill="#dcdad0" />
              </pattern>
            </defs>
            <rect
              class="paper-background"
              width="1100"
              height="720"
              fill="#fffefa"
            />
            <rect
              class="paper-grid"
              width="1100"
              height="720"
              fill="url(#dots)"
            />
            <g id="marks"></g>
            <g id="preview"></g>
            <circle id="cursor" r="4.5" hidden />
          </svg>
        </div>
        <footer class="board-footer">
          <span id="hint" role="status"
            >Draw with your mouse, touch, or pen.</span
          >
          <button
            id="pan"
            class="link-button"
            type="button"
            aria-pressed="false"
            hidden
          >
            Pan
          </button>
          <button
            id="page-label"
            class="link-button"
            type="button"
            aria-haspopup="dialog"
          >
            Page 1 of 1
          </button>
        </footer>
      </section>
      <p id="caption" class="caption" aria-live="polite" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
      <dialog id="type-dialog">
        <form id="type-form" method="dialog">
          <h2>Write on the board</h2>
          <label for="typed">Text or equation</label>
          <textarea
            id="typed"
            maxlength="480"
            rows="4"
            placeholder="For example, √18 = 3√2"
            required
          ></textarea>
          <div class="symbols" id="symbols" aria-label="Math symbols">
            <button type="button" aria-label="Square root">√</button
            ><button type="button" aria-label="Multiply">×</button
            ><button type="button" aria-label="Divide">÷</button
            ><button type="button" aria-label="Squared">²</button
            ><button type="button" aria-label="Cubed">³</button
            ><button type="button" aria-label="Pi">π</button>
          </div>
          <p id="type-error" class="error" role="alert" hidden></p>
          <div class="dialog-actions">
            <button
              class="button secondary"
              type="submit"
              value="cancel"
              formnovalidate
            >
              Cancel</button
            ><button class="button primary" type="submit" value="write">
              Write
            </button>
          </div>
        </form>
      </dialog>
      <dialog id="clear-dialog">
        <form method="dialog">
          <h2>Clear this page?</h2>
          <p>You can bring the ink back with Undo.</p>
          <div class="dialog-actions">
            <button class="button secondary" value="cancel">Cancel</button
            ><button class="button primary" value="clear">Clear page</button>
          </div>
        </form>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <div class="settings-heading">
          <h2 id="settings-title">Board settings</h2>
          <form method="dialog">
            <button class="button secondary" aria-label="Close settings">
              Done
            </button>
          </form>
        </div>
        <section class="settings-section" aria-labelledby="pages-title">
          <div class="settings-row">
            <h3 id="pages-title">Pages</h3>
            <button id="new-page" class="button secondary" type="button">
              Add page
            </button>
          </div>
          <div id="page-list" class="page-list" aria-label="Pages"></div>
        </section>
        <section class="settings-section" aria-labelledby="canvas-title">
          <h3 id="canvas-title">Canvas size</h3>
          <form id="resize-form" class="size-form">
            <label for="canvas-width"
              >Width<input
                id="canvas-width"
                type="number"
                min="480"
                max="2200"
                required
            /></label>
            <label for="canvas-height"
              >Height<input
                id="canvas-height"
                type="number"
                min="360"
                max="1600"
                required
            /></label>
            <button class="button secondary" type="submit">Apply</button>
          </form>
        </section>
        <section
          class="settings-section setting-extras"
          aria-label="View and export"
        >
          <label for="zoom"
            >View zoom
            <select id="zoom">
              <option value="100">Fit page</option>
              <option value="125">125%</option>
              <option value="150">150%</option>
              <option value="200">200%</option>
            </select>
          </label>
          <button id="export" class="button secondary" type="button">
            Download SVG
          </button>
        </section>
        <button id="demo" class="link-button" type="button">
          Try a surds lesson
        </button>
        <p id="settings-error" class="error" role="alert" hidden></p>
      </dialog>
    </main>
  </body>
</html>
